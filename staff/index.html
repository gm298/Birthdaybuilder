<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny staff inbox</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/staff.css?v=20260916a">
</head>
<body>
  <div class="staff-shell">
    <header class="staff-top">
      <div>
        <p class="staff-brand">Tiny Healthy Cafe</p>
        <h1 id="page-title">Staff inbox</h1>
      </div>
      <div class="staff-top__meta">
        <p class="muted" id="live-clock"></p>
        <button class="btn btn--ghost" type="button" id="sign-out" hidden>Sign out</button>
      </div>
    </header>

    <section class="card" id="login-card">
      <h2>Staff login</h2>
      <p class="lede">Only Tiny staff accounts can open saved reservations, parties, and cake requests.</p>
      <form id="login-form">
        <label class="field">
          <span>Email</span>
          <input type="email" id="login-email" autocomplete="username" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>
        <button class="btn" type="submit">Sign in</button>
        <p class="status" id="login-status" role="status"></p>
      </form>
    </section>

    <section id="app" hidden>
      <nav class="app-switch" aria-label="Inbox">
        <a href="#/reservations/overview" data-section="reservations">Reservations</a>
        <a href="#/birthdays" data-section="birthdays">Birthdays</a>
      </nav>

      <nav class="subnav" id="res-nav" aria-label="Reservation views">
        <a href="#/reservations/overview" data-view="overview">Overview</a>
        <a href="#/reservations/calendar" data-view="calendar">Calendar</a>
        <a href="#/reservations/timeline" data-view="timeline">Timeline</a>
      </nav>

      <div id="reservations-view">
        <div class="toolbar toolbar--res">
          <p class="date-label" id="selected-date-label"></p>
          <input type="date" id="res-date" aria-label="Reservation date">
        </div>
        <div id="overview-view">
          <div class="stat-grid" id="stat-grid"></div>
          <div class="booking-list" id="booking-list"></div>
          <p class="status" id="overview-status" role="status"></p>
        </div>
        <div id="calendar-view" hidden>
          <div class="cal-head">
            <button class="btn btn--ghost" type="button" id="cal-prev" aria-label="Previous month">‹</button>
            <h2 id="cal-title"></h2>
            <button class="btn btn--ghost" type="button" id="cal-next" aria-label="Next month">›</button>
          </div>
          <div class="cal-legend">
            <span class="dot dot--new"></span> New booking
            <span class="dot dot--booked"></span> Confirmed
            <span class="dot dot--cancelled"></span> Cancelled
            <span class="dot dot--rejected"></span> Rejected
            <span class="dot dot--closed"></span> Finished
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
        <div id="timeline-view" hidden>
          <p class="muted" id="timeline-count"></p>
          <div class="timeline" id="timeline"></div>
        </div>
      </div>

      <div id="birthdays-view" hidden>
        <div class="toolbar">
          <input type="search" id="search" placeholder="Search code, child, email, phone">
          <select id="filter-status" aria-label="Status">
            <option value="">All statuses</option>
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="quoted">Quoted</option>
            <option value="booked">Booked</option>
            <option value="closed">Closed</option>
          </select>
          <select id="filter-source" aria-label="Source">
            <option value="">All sources</option>
            <option value="party_builder">Party builder</option>
            <option value="cake">Cake</option>
            <option value="pdf_quote">PDF request</option>
          </select>
        </div>
        <div id="list-view">
          <div class="table-wrap">
            <table class="inbox">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Submitted</th>
                  <th>Party / cake date</th>
                  <th>Who</th>
                  <th>Package</th>
                  <th>Total</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="inbox-body"></tbody>
            </table>
          </div>
          <p class="status" id="list-status" role="status"></p>
        </div>
      </div>

      <div id="detail-view" hidden></div>
    </section>
  </div>
  <script src="../shared/supabase-config.js?v=20260910a"></script>
  <script type="module" src="js/app.js?v=20260916a"></script>
</body>
</html>
